[package]
name = "storagepk-desktop"
version = "0.3.0"
description = "StoragePK desktop connector"
authors = ["StoragePK contributors"]
license = "MIT"
repository = "https://github.com/TrisMinh/StoragePK"
edition = "2021"

[lib]
name = "storagepk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
base64 = "0.23"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
