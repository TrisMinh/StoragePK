name: Bug report
description: Report a reproducible problem in StoragePK.
title: "[Bug]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve StoragePK. Remove access tokens, OAuth credentials,
        provider object links, personal file names, and other sensitive data before submitting.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where did the problem occur?
      options:
        - Windows desktop app
        - Web app
        - API
        - Worker
        - Google Drive integration
        - Telegram integration
        - Installation or release package
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: StoragePK version
      description: Use the release version, tag, or commit SHA.
      placeholder: v0.3.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS/version, architecture, and browser when relevant.
      placeholder: Windows 11 24H2 x64; StoragePK desktop installer
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and how it affected you.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only sanitized output. Drag screenshots into this field if useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets, credentials, private links, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
