name: Windows Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable version tag, for example v0.3.0
        required: true
        type: string
      allow_unsigned_release:
        description: Explicitly allow unsigned Windows binaries for this release
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}

      - name: Verify tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version v$version."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Validate application release
        run: npm run release

      - name: Build and verify desktop installers
        env:
          STORAGEPK_GOOGLE_CLIENT_ID: ${{ secrets.STORAGEPK_GOOGLE_CLIENT_ID }}
          STORAGEPK_GOOGLE_CLIENT_SECRET: ${{ secrets.STORAGEPK_GOOGLE_CLIENT_SECRET }}
        run: npm run release:desktop

      - name: Verify Authenticode release status
        shell: pwsh
        env:
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned_release }}
        run: |
          $installers = @(
            Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -File |
              Where-Object { $_.Extension -in ".exe", ".msi" }
          )
          if ($installers.Count -ne 2) {
            throw "Expected exactly one EXE and one MSI installer."
          }
          $unsigned = @(
            $installers | Where-Object {
              (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne "Valid"
            }
          )
          if ($unsigned.Count -gt 0 -and $env:ALLOW_UNSIGNED -ne "true") {
            throw "Unsigned release assets require the explicit allow_unsigned_release approval."
          }
          if ($unsigned.Count -gt 0) {
            Write-Warning "Publishing an explicitly approved unsigned release."
          }

      - name: Generate CycloneDX dependency SBOM
        shell: pwsh
        run: |
          npm sbom --sbom-format cyclonedx |
            Out-File -FilePath storagepk-node-sbom.cdx.json -Encoding utf8
          Get-Content storagepk-node-sbom.cdx.json -Raw |
            ConvertFrom-Json |
            Out-Null

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: storagepk-windows-${{ inputs.release_tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            storagepk-node-sbom.cdx.json

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}

      - name: Download installer artifact
        uses: actions/download-artifact@v5
        with:
          name: storagepk-windows-${{ inputs.release_tag }}
          path: artifacts/windows

      - name: Create immutable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $nsis = @(Get-ChildItem artifacts/windows -Recurse -File -Filter *.exe)
          $msi = @(Get-ChildItem artifacts/windows -Recurse -File -Filter *.msi)
          $sbom = @(Get-ChildItem artifacts/windows -Recurse -File -Filter *.cdx.json)
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1 -or $sbom.Count -ne 1) {
            throw "Expected one NSIS installer, one MSI package, and one SBOM; found $($nsis.Count) EXE, $($msi.Count) MSI, and $($sbom.Count) SBOM files."
          }

          $releaseFiles = @($nsis[0], $msi[0], $sbom[0]) | Sort-Object Name
          $checksumPath = Join-Path $PWD "SHA256SUMS.txt"
          $checksumLines = foreach ($file in $releaseFiles) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
            "$hash  $($file.Name)"
          }
          $checksumLines | Set-Content -LiteralPath $checksumPath -Encoding utf8
          $artifacts = @($releaseFiles.FullName) + $checksumPath
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists. Versioned assets are immutable; publish a new version."
          }
          $createArgs = @(
            "release", "create", $env:RELEASE_TAG
          ) + $artifacts + @(
            "--repo", $env:GITHUB_REPOSITORY,
            "--verify-tag",
            "--title", "StoragePK $env:RELEASE_TAG",
            "--generate-notes"
          )
          & gh @createArgs
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed."
          }
